[package]
name = "lychrel"
version = "0.9.0"
edition = "2024"
rust-version = "1.88"
description = "Python bindings for Lychrel numbers and other funny mathematical problems"
homepage = "https://github.com/alesanfra/lychrel"
repository = "https://github.com/alesanfra/lychrel"
license = "MIT"
publish = false

[lib]
name = "lychrel"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["num-bigint"] }
num-bigint = "0.4"
num-traits = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
